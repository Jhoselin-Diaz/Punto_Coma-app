    /* Ocultar insignia flotante forzada de Netlify */
    netlify-badge,
    [data-netlify-badge],
    .netlify-badge,
    #netlify-badge,
    div[class*="netlify-badge"],
    iframe[src*="netlify"],
    a[href*="netlify.com"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
      left: -9999px !important;
      width: 0 !important;
      height: 0 !important;
    }
  </style>
